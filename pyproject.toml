[project]
name = "litegate"
version = "1.12.1"
description = "LiteGate - capability-aware, multimodal AI gateway for teams running their own model servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "neronain" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    # SQLite เป็นค่าเริ่มต้นและเป็น dependency หลัก — ลูกค้าเครื่องเดียวต้องลงแล้วใช้ได้เลย
    # โดยไม่ต้องมีเซิร์ฟเวอร์ฐานข้อมูล · Postgres อยู่ใน extra ชื่อ [postgres]
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "pyyaml>=6.0",
    "redis>=5.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.12",
    # ใช้ปิดผนึก API key ที่ออกไปแล้ว เพื่อให้ admin เรียกดูซ้ำได้ (AES-GCM)
    # เปิดใช้ก็ต่อเมื่อตั้ง GW_KEY_REVEAL_SECRET เท่านั้น — ดู app/core/keyvault.py
    "cryptography>=42",
]

[project.optional-dependencies]
# ── ของเสริม ทั้งสองกลุ่มเลือกได้อิสระ ──────────────────────────────────────────
#
# เกตเวย์ต้องลงแล้วใช้งานได้ครบโดยไม่ต้องลงอะไรเพิ่ม · ลูกค้าที่รันใน air-gapped หรือ
# ที่นโยบายองค์กรให้ลงเฉพาะของที่ผ่านการตรวจ จะได้ไม่ต้องดันของที่ตัวเองไม่ได้ใช้เข้าไป

# ฐานข้อมูล PostgreSQL — จำเป็นเมื่อตั้ง GW_DATABASE_URL=postgresql+asyncpg://...
# ไม่ลงก็รันได้ตามปกติบน SQLite · ดู docs/DEPLOYMENT.md §5
postgres = ["asyncpg>=0.29"]

# ตัวเข้ารหัส JSON ที่เร็วกว่า stdlib หลายเท่าสำหรับคำตอบก้อนใหญ่และสตรีม
# ไม่ลง = ตกกลับไปใช้ json ของ stdlib เอง ผลลัพธ์เหมือนกันทุกประการ · ดู app/core/jsonio.py
speed = ["orjson>=3.10"]

dev = [
    # tomllib เข้ามาเป็น stdlib ตอน 3.11 — Ubuntu 22.04 มาพร้อม 3.10 ซึ่งเรารองรับ
    # เทสที่อ่าน pyproject จึงต้องมีของให้อ่านบนรุ่นนั้นด้วย (โค้ดของแอปไม่ได้ใช้ toml เลย)
    "tomli>=2.0; python_version < '3.11'",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    # เทสต้องเห็นทั้งทางที่ลงของเสริมแล้วและทางที่ยังไม่ได้ลง
    "asyncpg>=0.29",
    "orjson>=3.10",
]

[project.urls]
Homepage = "https://github.com/neronain/AiGatewayLocal"
Author = "https://www.facebook.com/neronain.minidev"

[project.scripts]
litegate = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite imports shared helpers as `tests.conftest`, so the repo root must be
# on sys.path. Do not rely on the editable install to put it there - newer
# setuptools maps only the `app` package, which breaks collection.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
