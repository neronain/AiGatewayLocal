[project]
name = "litegate"
version = "1.4.0"
description = "LiteGate - capability-aware, multimodal AI gateway for education"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "neronain" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "pyyaml>=6.0",
    "redis>=5.1",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.12",
    # ใช้ปิดผนึก API key ที่ออกไปแล้ว เพื่อให้ admin เรียกดูซ้ำได้ (AES-GCM)
    # เปิดใช้ก็ต่อเมื่อตั้ง GW_KEY_REVEAL_SECRET เท่านั้น — ดู app/core/keyvault.py
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://github.com/neronain/AiGatewayLocal"
Author = "https://www.facebook.com/neronain.minidev"

[project.scripts]
litegate = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The suite imports shared helpers as `tests.conftest`, so the repo root must be
# on sys.path. Do not rely on the editable install to put it there - newer
# setuptools maps only the `app` package, which breaks collection.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
