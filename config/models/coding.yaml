apiVersion: litegate.dev/v1
kind: Model

metadata:
  alias: coding
  display_name: Local Coder
  description: >-
    Agentic coding model with tool calling and long context.
    Validated for Claude Code and Qwen Code.
  visibility: member
  tags: [coding, agent, claude-code]

spec:
  upstream_model: ucbye/Qwen3-Coder-Next-NVFP4-GB10

  purpose:
    - coding
    - agent

  limits:
    context_tokens: 262144
    max_output_tokens: 16384

  # อักขระนอก ASCII ต่อ token ของโมเดลตัวนี้ — **วัดมา ไม่ใช่เดา**
  #
  # ไม่ตั้ง = ใช้ค่าสำรองกลาง 1.6 ซึ่งครอบไม่ได้ทุกโมเดล: pre-tokenizer ของบางตัว
  # ไม่นับเครื่องหมายประสม เลยฉีก "ที่" เป็น "ท" + "ี่" ทำให้ไทยตกราว 1.8 อักขระ/token
  # ส่วนตัวที่ถูกต้องได้ราว 3.9 — ต่างกัน 2.1 เท่า
  #
  # ค่านี้คุมด่าน context และยอดโควตา · ตั้งต่ำไป = นับเกิน ผู้ใช้ชนเพดานเร็วและถูกคิด
  # เงินเกิน · ตั้งสูงไป = นับขาด ซึ่งเป็นช่องโหว่โควตา
  #
  # วัดเอง: POST /tokenize ของ backend ด้วยข้อความไทยยาว ๆ แล้วหารอักขระนอก ASCII
  # ด้วยจำนวน token ที่ได้ (หักส่วน ASCII ออกก่อน) · หรือปล่อยให้หน้าเพิ่มโมเดลวัดให้
  wide_chars_per_token: 1.89

  modalities:
    input: [text]
    output: [text]

  capabilities:
    chat: true
    vision: false          # -> image requests to this alias are rejected with 400
    coding: true
    tools: true
    streaming: true
    reasoning: false
    agentic: true
    audio: false
    embedding: false

  protocols:
    openai: true
    anthropic: true
    responses: true        # -> Codex · แปลจาก/เป็น chat completions ให้อัตโนมัติ

  agent_clients:
    claude_code:
      enabled: true
      tested: true
      notes: "MODEL-009 passed 2026-08-12; tools + streaming + 256K context."
    qwen_code:
      enabled: true
      tested: true
    cline:
      enabled: false
      tested: false

  endpoints:
    - name: dgx03
      server_type: vllm
      base_url: http://dgx03:8000
      api_key_env: DGX03_API_KEY
      priority: 100
      weight: 1
      max_concurrency: 16
      health_path: /health
      protocols:
        openai: true
        # vLLM does not serve the Anthropic API; the gateway translates.
        anthropic: false
      modalities:
        text: true
        image: false
        audio: false
        video: false
      enabled: true
