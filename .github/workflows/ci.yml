name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts

      - name: Validate the model registry
        run: |
          python - <<'PY'
          from pathlib import Path
          from app.registry.store import load_snapshot
          snapshot = load_snapshot(Path("config"))
          if snapshot.errors:
              raise SystemExit("registry errors:\n" + "\n".join(snapshot.errors))
          print("registry OK:", ", ".join(sorted(snapshot.models)))
          PY

      - name: Test
        run: pytest tests/ -v --tb=short

  secret-scan:
    name: secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository is public and the gateway issues real credentials, so a key
      # leaked here is a live key. Unlike the sibling LMDS repository this scan does
      # NOT skip tests/ - nothing under tests/ hardcodes a key today (they are minted
      # at runtime with token_urlsafe) and keeping it that way is worth more than the
      # convenience of a realistic-looking fixture. If a test needs a fake key, make
      # it obviously fake rather than widening this scan.
      - name: Scan for committed API keys
        run: |
          if grep -rInE '(lg_sk_[A-Za-z0-9_-]{20,}|edu_sk_[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|hf_[A-Za-z0-9]{30,}|ghp_[A-Za-z0-9]{30,})' \
              --exclude-dir=.git --exclude-dir=.github --exclude-dir=.venv \
              --exclude-dir=bundles --exclude-dir=node_modules . ; then
            echo "::error::Found a string shaped like a real API key. If it is a fixture, make it obviously fake."
            exit 1
          fi
          echo "no key-shaped strings found"

      # .gitignore already covers these. This is the check that catches the day
      # somebody force-adds one.
      - name: Refuse a tracked environment file
        run: |
          tracked=$(git ls-files '.env' '.env.*' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::An environment file is tracked. Secrets belong outside the repository."
            echo "$tracked"
            exit 1
          fi
          echo "no tracked environment files"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t litegate:ci .

      - name: Boot the container and check health
        run: |
          docker run -d --name gw \
            -e GW_API_KEY_PEPPER=ci-test-pepper-not-secret \
            -e GW_DATABASE_URL=sqlite+aiosqlite:///./data/ci.db \
            -p 8080:8080 litegate:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs gw; exit 1

      - name: Container logs
        if: always()
        run: docker logs gw || true
