# nginx reverse proxy for the LiteGate.
# Use this when the site already standardises on nginx; otherwise prefer the
# Caddy config in docker/Caddyfile (automatic certificates).
#
# Install: /etc/nginx/sites-available/litegate.conf
#          ln -s ../sites-available/litegate.conf /etc/nginx/sites-enabled/

upstream litegate {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Per-IP guard in front of the gateway's own per-user quota. Sized well above
# normal classroom usage - it exists to blunt a runaway script, not to enforce
# policy. Real limits are per user, inside the gateway.
limit_req_zone $binary_remote_addr zone=litegate_req:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=litegate_conn:10m;

server {
    listen 80;
    server_name gateway.university.ac.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gateway.university.ac.th;

    ssl_certificate     /etc/ssl/certs/litegate.crt;
    ssl_certificate_key /etc/ssl/private/litegate.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Base64 images arrive inside the JSON body: 4 images x 10 MB, inflated by
    # base64 (~4/3), plus headroom. Keep in step with vision_policy.
    client_max_body_size 64m;
    client_body_buffer_size 1m;

    limit_req zone=litegate_req burst=60 nodelay;
    limit_conn litegate_conn 20;

    location / {
        proxy_pass http://litegate;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # --- Streaming (SSE) ------------------------------------------------
        # Without these, tokens are buffered and the response arrives all at
        # once when generation ends.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # Long generations and agent loops run for minutes.
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    # Metrics and the admin plane must not be reachable from the member network.
    location /metrics {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://litegate;
    }

    location /admin/ {
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://litegate;
        proxy_set_header Host $host;
    }

    access_log /var/log/nginx/litegate.access.log;
    error_log  /var/log/nginx/litegate.error.log warn;
}
